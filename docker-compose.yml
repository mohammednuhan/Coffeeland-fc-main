name: coffeelandfc

services:
  backend:
    build:
      context: ./backend
    image: coffeelandfc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: file:../data/database.sqlite
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    volumes:
      - backend-data:/app/data
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
    image: coffeelandfc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
